<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login page</title>
</head>
<body style="background-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e'); background-size: cover; background-repeat: no-repeat; background-position: center;border:10px black">
    <form style="background-color:lightblue; padding:20px; width:300px; margin:auto; margin-top:100px; border-radius:10px;">
        <h1 style="color:aqua;text-align: center;text-decoration: underline black;">Login Page</h1>
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required><br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>
        <button type="submit" style="background-color: aqua; color: white; border: none; padding: 10px 20px; cursor: pointer;padding-right: 30px;margin-right: 10px;">Login</button>
        <button type="reset" style="background-color: lightgray; color: black; border: none; padding: 10px 20px; cursor: pointer;">Reset</button>
    </form>
</body>
</html>
