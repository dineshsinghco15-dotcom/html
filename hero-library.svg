<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="600" height="440">
  <defs>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="shelfGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f2b48"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="440" rx="16" fill="url(#wallGrad)"/>
  <circle cx="300" cy="220" r="180" fill="url(#glowGrad)"/>

  <!-- Floor -->
  <path d="M0 380 L600 380 L600 440 L0 440 Z" fill="#cbd5e1"/>
  <line x1="0" y1="380" x2="600" y2="380" stroke="#94a3b8" stroke-width="2"/>

  <!-- Arch Window / Architectural Feature -->
  <path d="M180 80 Q300 30 420 80 V260 H180 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="2" opacity="0.8"/>
  <line x1="300" y1="55" x2="300" y2="260" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="180" y1="170" x2="420" y2="170" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Left Bookshelf -->
  <rect x="50" y="100" width="130" height="280" rx="4" fill="url(#shelfGrad)"/>
  <!-- Shelf lines -->
  <rect x="55" y="150" width="120" height="8" fill="#d97706" rx="2"/>
  <rect x="55" y="210" width="120" height="8" fill="#d97706" rx="2"/>
  <rect x="55" y="270" width="120" height="8" fill="#d97706" rx="2"/>
  <rect x="55" y="330" width="120" height="8" fill="#d97706" rx="2"/>

  <!-- Books on Left Shelf -->
  <rect x="62" y="112" width="14" height="38" fill="#ef4444" rx="2"/>
  <rect x="78" y="116" width="16" height="34" fill="#3b82f6" rx="2"/>
  <rect x="96" y="108" width="18" height="42" fill="#10b981" rx="2"/>
  <rect x="116" y="114" width="14" height="36" fill="#f59e0b" rx="2"/>
  <rect x="132" y="118" width="20" height="32" fill="#8b5cf6" rx="2"/>

  <rect x="65" y="170" width="18" height="40" fill="#38bdf8" rx="2"/>
  <rect x="85" y="174" width="14" height="36" fill="#ec4899" rx="2"/>
  <rect x="101" y="168" width="22" height="42" fill="#eab308" rx="2"/>
  <rect x="125" y="172" width="16" height="38" fill="#14b8a6" rx="2"/>
  <rect x="143" y="176" width="18" height="34" fill="#6366f1" rx="2"/>

  <rect x="63" y="230" width="15" height="40" fill="#f97316" rx="2"/>
  <rect x="80" y="236" width="16" height="34" fill="#06b6d4" rx="2"/>
  <rect x="98" y="228" width="20" height="42" fill="#a855f7" rx="2"/>
  <rect x="120" y="234" width="14" height="36" fill="#22c55e" rx="2"/>

  <!-- Right Bookshelf -->
  <rect x="420" y="100" width="130" height="280" rx="4" fill="url(#shelfGrad)"/>
  <rect x="425" y="150" width="120" height="8" fill="#d97706" rx="2"/>
  <rect x="425" y="210" width="120" height="8" fill="#d97706" rx="2"/>
  <rect x="425" y="270" width="120" height="8" fill="#d97706" rx="2"/>
  <rect x="425" y="330" width="120" height="8" fill="#d97706" rx="2"/>

  <rect x="432" y="112" width="16" height="38" fill="#3b82f6" rx="2"/>
  <rect x="450" y="108" width="20" height="42" fill="#10b981" rx="2"/>
  <rect x="472" y="115" width="15" height="35" fill="#f43f5e" rx="2"/>
  <rect x="489" y="110" width="18" height="40" fill="#eab308" rx="2"/>
  <rect x="509" y="116" width="18" height="34" fill="#8b5cf6" rx="2"/>

  <rect x="435" y="172" width="18" height="38" fill="#ec4899" rx="2"/>
  <rect x="455" y="168" width="14" height="42" fill="#06b6d4" rx="2"/>
  <rect x="471" y="175" width="22" height="35" fill="#10b981" rx="2"/>
  <rect x="495" y="170" width="16" height="40" fill="#f97316" rx="2"/>

  <!-- Study Desk in Center -->
  <ellipse cx="300" cy="360" rx="140" ry="24" fill="#1e293b"/>
  <polygon points="180,360 420,360 410,380 190,380" fill="#0f172a"/>
  <!-- Desk Legs -->
  <rect x="210" y="380" width="12" height="45" fill="#334155"/>
  <rect x="378" y="380" width="12" height="45" fill="#334155"/>

  <!-- Laptop on desk -->
  <polygon points="265,348 335,348 345,358 255,358" fill="#94a3b8"/>
  <polygon points="270,305 330,305 335,348 265,348" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <rect x="274" y="310" width="52" height="34" fill="#38bdf8" opacity="0.9"/>
  <!-- Digital search icon on laptop screen -->
  <circle cx="300" cy="327" r="7" fill="none" stroke="#ffffff" stroke-width="2"/>
  <line x1="305" y1="332" x2="312" y2="339" stroke="#ffffff" stroke-width="2"/>

  <!-- Open Book beside Laptop -->
  <path d="M355 352 C365 348 375 348 385 352 V360 C375 356 365 356 355 360 Z" fill="#ffffff" stroke="#cbd5e1"/>
  <path d="M385 352 C395 348 405 348 415 352 V360 C405 356 395 356 385 360 Z" fill="#ffffff" stroke="#cbd5e1"/>

  <!-- Desk Lamp -->
  <rect x="220" y="352" width="24" height="6" rx="2" fill="#64748b"/>
  <path d="M232 352 Q235 300 250 280" fill="none" stroke="#64748b" stroke-width="4"/>
  <polygon points="240,285 265,275 258,265" fill="#d97706"/>
  <!-- Warm Lamp Light Cone -->
  <polygon points="250,280 290,345 220,345" fill="#fef08a" opacity="0.25"/>

  <!-- Floating Stats Badges -->
  <g transform="translate(380, 50)">
    <rect width="170" height="50" rx="8" fill="#ffffff" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.08))" stroke="#e2e8f0"/>
    <circle cx="28" cy="25" r="14" fill="#ecfdf5"/>
    <text x="28" y="30" font-family="Arial" font-size="14" fill="#059669" text-anchor="middle">✓</text>
    <text x="50" y="22" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0f172a">50,000+ Books</text>
    <text x="50" y="38" font-family="Segoe UI, sans-serif" font-size="10" fill="#64748b">Cataloged &amp; Online</text>
  </g>

  <g transform="translate(50, 50)">
    <rect width="165" height="50" rx="8" fill="#ffffff" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.08))" stroke="#e2e8f0"/>
    <circle cx="26" cy="25" r="14" fill="#eff6ff"/>
    <text x="26" y="29" font-family="Arial" font-size="12" fill="#2563eb" text-anchor="middle">⚡</text>
    <text x="48" y="22" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Instant Issue</text>
    <text x="48" y="38" font-family="Segoe UI, sans-serif" font-size="10" fill="#64748b">Digital RFID Pass</text>
  </g>
</svg>